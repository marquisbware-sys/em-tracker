name: Update Expected Moves

on:
  schedule:
    # Daily at 14:45 UTC = 9:45am ET (15 min after market open, 0DTE options have live prices)
    - cron: '45 14 * * 1-5'
    # Monday-Thursday at 21:00 UTC = 4pm CT (market close, fresh end-of-day data)
    - cron: '0 21 * * 1-4'
    # Friday at 21:00 UTC = 4pm CT (right after market close)
    - cron: '0 21 * * 5'
    # Sunday at 23:00 UTC = 6pm CT (ready for Monday open)
    - cron: '0 23 * * 0'
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Single ticker to update (leave blank for full watchlist)'
        required: false
        default: ''

jobs:
  update-em:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas
      - name: Run EM calculation
        run: |
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            python calculate_em.py ${{ github.event.inputs.ticker }}
          else
            python calculate_em.py
          fi
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add expected_moves.json
          git diff --staged --quiet || git commit -m "Update EM data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
