ame: Update Expected Moves

on:
  schedule:
    # Every Sunday at 11pm UTC = 6pm Central (after Friday close, ready for Monday open)
    - cron: '0 23 * * 0'
    # Also run Friday at 9pm UTC = 4pm Central (right after market close)
    - cron: '0 21 * * 5'
  workflow_dispatch:  # Allow manual trigger from GitHub UI
    inputs:
      ticker:
        description: 'Single ticker to update (leave blank for full watchlist)'
        required: false
        default: ''

jobs:
  update-em:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas

      - name: Run EM calculation
        run: |
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            python calculate_em.py ${{ github.event.inputs.ticker }}
          else
            python calculate_em.py
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add expected_moves.json
          git diff --staged --quiet || git commit -m "Update EM data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
